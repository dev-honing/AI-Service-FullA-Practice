<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>분식왕 — 주문 접수</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      background: #faf6f0;
      color: #2b2320;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      position: relative;
      width: 100%;
      background: #d1372e;
      color: #fff;
      padding: 18px 24px;
      text-align: center;
    }
    #settings-btn {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      padding: 6px 10px;
      cursor: pointer;
      color: #fff;
    }
    #settings-btn:hover { background: rgba(255, 255, 255, 0.3); }
    header h1 { font-size: 1.35rem; }
    header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    main {
      width: 100%;
      max-width: 640px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 0 16px;
      overflow-y: auto;
    }
    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { align-self: flex-end; background: #d1372e; color: #fff; border-bottom-right-radius: 4px; }
    .clerk { align-self: flex-start; background: #fff; border: 1px solid #e8ded2; border-bottom-left-radius: 4px; }
    .clerk .receipt { margin-top: 8px; }
    .receipt table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
    .receipt th, .receipt td { text-align: left; padding: 4px 8px; border-bottom: 1px dashed #e0d5c5; }
    .receipt td.num, .receipt th.num { text-align: right; }
    .receipt tr.total td { font-weight: 700; border-bottom: none; padding-top: 8px; }
    .receipt .opts { color: #8a7a68; font-size: 0.8rem; }
    pre.raw {
      margin-top: 8px;
      background: #f4efe7;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
      overflow-x: auto;
    }
    #examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
    }
    #examples button {
      background: #fff;
      border: 1px solid #e0cdb6;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      color: #6b5844;
    }
    #examples button:hover { background: #f7efe3; }
    form { display: flex; gap: 8px; padding-bottom: 20px; }
    #message {
      flex: 1;
      border: 1px solid #ddcdb8;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }
    #message:focus { border-color: #d1372e; }
    #send {
      background: #d1372e;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: wait; }
    #settings-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #settings-modal[hidden] { display: none; }
    .modal-box {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      width: min(92vw, 420px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-box h2 { font-size: 1.05rem; }
    .modal-box label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: #6b5844;
    }
    .modal-box input {
      border: 1px solid #ddcdb8;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
    }
    .modal-box input:focus { border-color: #d1372e; }
    .modal-box .hint { font-size: 0.78rem; color: #8a7a68; line-height: 1.5; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-actions button {
      border: 1px solid #ddcdb8;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      background: #fff;
      cursor: pointer;
    }
    .modal-actions #settings-save {
      background: #d1372e;
      border-color: #d1372e;
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍜 분식왕</h1>
    <p>주문 접수 AI 점원 — week01 라이브 빌드</p>
    <button id="settings-btn" type="button" aria-label="환경 설정">⚙️</button>
  </header>

  <main>
    <div id="chat">
      <div class="bubble clerk">어서오세요, 분식왕입니다! 주문을 말씀해 주세요.</div>
    </div>

    <div id="examples">
      <button type="button">참치김밥 두 줄이랑 라면 하나, 라면은 치즈 추가</button>
      <button type="button">돈까스 되나요?</button>
      <button type="button">김밥 100줄 주세요</button>
      <button type="button">순대 1인분 주세요</button>
      <button type="button">/clear</button>
    </div>

    <form id="order-form">
      <input id="message" type="text" placeholder="예) 떡볶이 하나랑 어묵꼬치 두 개요 (/clear: 대화 초기화)" autocomplete="off" required />
      <button id="send" type="submit">주문</button>
    </form>
  </main>

  <div id="settings-modal" hidden>
    <div class="modal-box">
      <h2>⚙️ 환경 설정 (.env)</h2>
      <label>
        GEMINI_API_KEY
        <input id="set-key" type="password" placeholder="불러오는 중…" autocomplete="off" />
      </label>
      <label>
        MODEL
        <input id="set-model" type="text" placeholder="예) gemini/gemini-2.5-flash" autocomplete="off" />
      </label>
      <p class="hint">
        저장하면 서버의 <code>.env</code> 파일에 기록되고 즉시 적용됩니다.
        빈 칸으로 두면 기존 값이 유지됩니다. 로컬 시연용 기능입니다.
      </p>
      <div class="modal-actions">
        <button id="settings-cancel" type="button">닫기</button>
        <button id="settings-save" type="button">저장</button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("order-form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const GREETING = "어서오세요, 분식왕입니다! 주문을 말씀해 주세요.";

    function addBubble(cls, node) {
      const div = document.createElement("div");
      div.className = "bubble " + cls;
      if (typeof node === "string") div.textContent = node;
      else div.appendChild(node);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    // 주문서 json({items, total})이면 영수증으로, 아니면 메시지/원본 json으로 표시
    function renderResponse(data) {
      const wrap = document.createElement("div");
      if (data.message) {
        const p = document.createElement("div");
        p.textContent = data.message;
        wrap.appendChild(p);
      }
      if (Array.isArray(data.items) && data.items.length) {
        const receipt = document.createElement("div");
        receipt.className = "receipt";
        const rows = data.items.map((it) => {
          const opts = (it.options || []).map((o) => (typeof o === "string" ? o : o.name)).join(", ");
          const price = it.subtotal ?? it.price ?? it.unit_price ?? "";
          return `<tr>
            <td>${it.name ?? it.menu ?? ""}<div class="opts">${opts}</div></td>
            <td class="num">${it.quantity ?? it.qty ?? 1}</td>
            <td class="num">${typeof price === "number" ? price.toLocaleString() + "원" : price}</td>
          </tr>`;
        }).join("");
        const total = data.total ?? data.total_price;
        receipt.innerHTML = `<table>
          <tr><th>메뉴</th><th class="num">수량</th><th class="num">금액</th></tr>
          ${rows}
          ${total != null ? `<tr class="total"><td>합계</td><td></td><td class="num">${Number(total).toLocaleString()}원</td></tr>` : ""}
        </table>`;
        wrap.appendChild(receipt);
      }
      if (!data.message && !Array.isArray(data.items)) {
        const pre = document.createElement("pre");
        pre.className = "raw";
        pre.textContent = JSON.stringify(data, null, 2);
        wrap.appendChild(pre);
      }
      return wrap;
    }

    async function order(message) {
      addBubble("user", message);
      send.disabled = true;
      const pending = addBubble("clerk", "접수 중…");
      try {
        const res = await fetch("/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        pending.replaceChildren(renderResponse(data));
      } catch (err) {
        pending.textContent = "주문 접수에 실패했어요: " + err;
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    // "/"로 시작하는 입력은 주문이 아니라 명령으로 처리합니다
    function handleCommand(command) {
      if (command === "/clear") {
        chat.replaceChildren();
        addBubble("clerk", GREETING);
      } else {
        addBubble("clerk", "알 수 없는 명령이에요. 사용할 수 있는 명령: /clear");
      }
    }

    function handleInput(text) {
      const message = text.trim();
      if (!message) return;
      if (message.startsWith("/")) handleCommand(message);
      else order(message);
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = input.value;
      input.value = "";
      handleInput(message);
    });

    document.querySelectorAll("#examples button").forEach((btn) => {
      btn.addEventListener("click", () => handleInput(btn.textContent));
    });

    // ⚙️ 설정 모달 — GET/PUT /settings로 .env를 확인·저장
    const modal = document.getElementById("settings-modal");
    const keyInput = document.getElementById("set-key");
    const modelInput = document.getElementById("set-model");

    document.getElementById("settings-btn").addEventListener("click", async () => {
      modal.hidden = false;
      keyInput.value = "";
      try {
        const s = await (await fetch("/settings")).json();
        modelInput.value = s.model || "";
        keyInput.placeholder = s.gemini_api_key_set
          ? `설정됨 (${s.gemini_api_key_hint || "****"}) — 바꾸려면 새로 입력`
          : "미설정 — 키를 입력하세요";
      } catch {
        keyInput.placeholder = "설정을 불러오지 못했어요";
      }
    });

    document.getElementById("settings-cancel").addEventListener("click", () => {
      modal.hidden = true;
    });
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.hidden = true;
    });

    document.getElementById("settings-save").addEventListener("click", async () => {
      try {
        const res = await fetch("/settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            gemini_api_key: keyInput.value.trim() || null,
            model: modelInput.value.trim() || null,
          }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        modal.hidden = true;
        addBubble("clerk", ".env 설정을 저장했어요.");
      } catch (err) {
        addBubble("clerk", "설정 저장에 실패했어요: " + err);
      }
    });
  </script>
</body>
</html>
